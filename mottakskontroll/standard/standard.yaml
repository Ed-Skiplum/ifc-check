# Standardoppsett for mottakskontrollen: the default layer.
#
# Where the IFC standard itself puts each value the model report reads, and nothing else. It ships
# with the tool and is the same for every project. A project file (here krav.yaml) configures the
# project on top of it. Settled with edkjo 2026-09-24: «build the default against the IFC standard,
# and have configurations on top.»
#
# ONE location per requirement (edkjo 2026-09-24). `sted` is where the requirement is checked, and
# nowhere else: the control configures, it does not search. A project that requires the value
# somewhere else declares its own `sted`, which REPLACES this one (konfig.py); it is never added
# to it. A value that exists elsewhere in a model is not lost: it shows in the pset gallery. A
# requirement with no `sted` in either layer is «ikke konfigurert».
#
# The location prints once, in the block's «Sted» row: the standard layer has no `kilde` citation.
# A project's `kilde` (its BEP or manual section) prints after the requirement text.
#
# `krav_tekst` is the requirement as declared, printed as the block's first row. `gyldig` /
# `gyldige` / `kodetabell` / `ikke_materiale` are declared accepted values: where one exists, the
# block prints a validity row, and the requirement passes only with every value inside it.
#
# IFC4 definitions; where IFC2X3 differs it is noted.
#
# The standard property and quantity set names the pset gallery calls «IFC» ship beside this file,
# in standard_psett.yaml.
#
# Location kinds:
#   {pset, egenskap} / {pset_monster, egenskap_monster}   a property
#   {ifc: typeobjekt | globalid | romlig | materialtilknytning}
#   {ifc: klassifikasjon, system_monster}  IfcClassificationReference reached through
#         IfcRelAssociatesClassification on the object or its type, whose classification system
#         (IfcClassification.Name up the ReferencedSource chain) matches system_monster. The value is
#         Identification in IFC4 and ItemReference in IFC2X3.

# The schema is a KPI tile, not a requirement block (edkjo 2026-09-24): «There is only two things to
# say about schema: schema version and is it the required schema.» FILE_SCHEMA as written; the
# verdict compares its family (IFC2X3, IFC4, IFC4X3; «IFC4 ADD2 TC1» is IFC4) against `godtatte`.
# A project may narrow or change the set, and may declare exceptions by exporter
# (`unntak`: {skjema, system_monster} matched against FILE_NAME.originating_system).
skjema:
  kilde: IFC4 FILE_SCHEMA
  godtatte: [IFC2X3, IFC4]

# The requirement verdict's words (edkjo 2026-09-24). Three states from the two numbers: green
# Oppfylt, yellow Kan brukes, red Ikke oppfylt (GUID is binary: green or red only). The green word
# is under review («OK»); one line here changes it everywhere.
# Labels (edkjo 2026-09-25, «but again, config»): section titles, list titles, gallery labels and
# mark words. The report and workbook read them from here; a project overrides any key in krav.yaml
