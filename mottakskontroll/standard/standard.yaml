# Moved from krav.yaml 2026-09-25: generic, so a standard-only run has them. A project may
# override each key in krav.yaml.
standard:
  terskel: {ok: 95, warn: 5}
  telte_objekter: >-
    Alle IfcProduct med 3D-geometri, uten IfcFeatureElementSubtraction. Andeler er av dette
    tallet, i både regneark og PDF.
  navnematching: >-
    Navn på egenskapssett og egenskaper matches uten hensyn til mellomrom og store/små
    bokstaver. Varianten som ble funnet rapporteres.

# The KPI band on the model report (docs/rapport-rammeverk.md, «KPI band»): counts only. The
# schema is a requirement (skjema), not a KPI. The other kpi entries stay in the workbook.
kpi_band: [antall_typer, antall_elementer, instanser_per_type_alle, typer_med_en_instans_alle, utypede_instanser]

# The band's counts (edkjo 2026-09-24): all over every IfcProduct in the file, the grunnlag of
# Typeobjekt, and types by name + IFC class (begreper §1). Plain numbers, no verdict.
kpi_alle:
  - id: antall_typer
    tittel: Antall typer
    maaler: Typer i bruk, typenavn + IFC-klasse, over alle IfcProduct.
  - id: antall_elementer
    tittel: Antall elementer
    maaler: Alle IfcProduct i fila, grunnlaget for Typeobjekt.
  - id: instanser_per_type_alle
    tittel: Instanser per type
    maaler: Typede IfcProduct delt på antall typer.
  - id: typer_med_en_instans_alle
    tittel: Typer med én instans
    maaler: Typer med ett IfcProduct, med andel av typene.
  - id: utypede_instanser
    tittel: Utypede instanser
    maaler: IfcProduct uten IfcRelDefinesByType, med andel av elementene.

verdiktord:
  oppfylt: OK
  kan_brukes: Kan brukes
  ikke_oppfylt: Ikke oppfylt
  gjelder_ikke: gjelder ikke
  ikke_konfigurert: ikke konfigurert

# Traffic lights on the Nøkkeltall cards (edkjo 2026-09-24; defaults for edkjo to confirm). `retning:
# lav` is green below `gronn`, yellow up to `gul`, red above; `hoy` is green at or above `gronn`,
# yellow from `gul`, red below. Antall typer and Antall elementer are context, with no threshold and
# no tint, unless a project configures one. The IFC-skjema card is green in the accepted set, red not.
kpi_terskler:
  typer_med_en_instans_alle: {retning: lav, gronn: 20, gul: 40}    # % of types
  utypede_instanser: {retning: lav, gronn: 5, gul: 20}             # % of elements
  instanser_per_type_alle: {retning: hoy, gronn: 10, gul: 3}

# Traffic light for Gyldig, the share of present values that are valid (edkjo 2026-09-24, default
# for edkjo to confirm): green at 100 %, amber from 95 %, red below. Dekning uses the project's
# `standard.terskel` (green ≥ 95 %, red < 5 %). The requirement's verdict needs Gyldig ≥ `ok`.
terskel_gyldig: {ok: 100, warn: 95}

seksjoner:
  - {id: ifc_helse, tittel: IFC-struktur}
  - {id: standardkrav, tittel: Standardkrav}

blokker:
  # ---- IFC-struktur
  - id: typeobjekt
    seksjon: ifc_helse
    tittel: Typeobjekt
    krav_tekst: alle IfcProduct utenom romlig struktur har typeobjekt med navn
    # Every IfcProduct in the file, not only the counted set (edkjo 2026-09-24), minus the
    # spatial structure (IfcSite/IfcBuilding/IfcBuildingStorey/IfcSpace/zones).
    grunnlag: alle_ifcproduct
    sted: {ifc: typeobjekt, navn: IfcRelDefinesByType}

  - id: guid
    seksjon: ifc_helse
    tittel: GUID
    krav_tekst: ingen GlobalId to ganger i fila
    # Counts, not coverage: «Duplikater i fila» decides (0 = oppfylt); «Delt med andre modeller»
    # is a reading.
    telling: true
    sted: {ifc: globalid, navn: GlobalId}

  - id: etasjedefinisjon
    seksjon: ifc_helse
    tittel: Etasjedefinisjon
    krav_tekst: modellens etasjer er de konfigurerte, med navn og kote
    # The model's IfcBuildingStorey against the configured floors (the etasjematrise). Oppfylt when
    # the model has no extra levels and every matched level's name and kote are within tolerance; a
    # configured level the model lacks is allowed and shown. No floors configured: «ikke
    # konfigurert» for the verdict, and the matrix lists the model's floors only.
    sted: {ifc: etasjer, navn: IfcBuildingStorey}

  - id: etasjer
    seksjon: ifc_helse
    tittel: Objekter i etasje
    krav_tekst: alle objekter plassert i en etasje, med bunnen i etasjens spenn
    # Contained in a storey (dekning), and, as its validity, where the object's geometry sits against
    # its stated storey's span [elev, next_elev), the top storey open, elevations being
    # IfcBuildingStorey.Elevation scaled by the unit scale. Three states (Ed-Skiplum/ifc-check#2,
    # the same rule ifc-check applies):
    #   oppfylt  elev <= bunn < next_elev
    #   avvik    elev - spenn_under_toleranse_m <= bunn < elev, and topp >= elev
    #   mangler  anything else, a bottom at or above next_elev included; no tolerance upward
    # Refused (a gap with its reason) with fewer than two distinct storey elevations, or when the
    # elevation span and the span of the mesh bottoms do not overlap.
    spenn_under_toleranse_m: 0.10
    sted: {ifc: romlig, navn: IfcRelContainedInSpatialStructure}

  # ---- Standardkrav
  - id: systemkode
    seksjon: standardkrav
    tittel: Systemkode NS 3451
    krav_tekst: tresifret NS 3451-kode
    gyldig: '^\d{3}$'
    sted: {ifc: klassifikasjon, system_monster: '3451', navn: IfcClassificationReference NS 3451}
    # The aggregated code list (a catalogue, not a check): rendered only while the requirement has
    # a location. Names and validity from the bundled table.
    # The code table is a reference: `kilde` names the list, `fil` the file (a YAML or JSON list,
    # beside this file or an absolute path), `felt` its code and name keys. Swapping to another
    # table (e.g. ifc-check's bundled NS 3451, 813 codes) is a change here, not in code.
    kodeliste: {kilde: ns3451, fil: kodetabell_ns3451.yaml, felt: {kode: kode, navn: navn}}

  - id: funksjonskode
    seksjon: standardkrav
    tittel: Funksjonskode NS 3457-8
    krav_tekst: komponentkode fra NS 3457-8
    # Accepted values: the NS 3457-8 code table.
    kodetabell: mengdetype_ns3457.yaml
    sted: {ifc: klassifikasjon, system_monster: '3457', navn: IfcClassificationReference NS 3457}
    kodeliste: {kilde: ns3457-8, fil: mengdetype_ns3457.yaml, felt: {kode: kode, navn: navn}}

  # Produkt and Materiale are two requirements (edkjo 2026-09-24), switched by mengdetype
  # (begreper §6): a telleobjekt must carry a product, a mengdeobjekt a material configuration.
  # Mengdetype is the tool's analysis (the class table first, the code table where the class cannot
  # decide), not a requirement and not a checked location. Each is «gjelder ikke» when the model has
  # no objects of its kind.
  - id: produkt
    seksjon: standardkrav
    tittel: Produkt
    krav_tekst: telleobjekter har produkt
    grunnlag: telleobjekt
    mengdetype:
      - {ifc: ifcklasse, tabell: mengdetype_ifcklasse.yaml, navn: IFC-klasse}
      - {ifc: komponentkode, tabell: mengdetype_ns3457.yaml, navn: komponentkode}
    # Pset_ManufacturerTypeInformation.ModelReference, the product model's designator (IFC4 and
    # IFC2X3 alike).
    sted: {pset: Pset_ManufacturerTypeInformation, egenskap: ModelReference}

  - id: materiale
    seksjon: standardkrav
    tittel: Materiale
    krav_tekst: mengdeobjekter har materiale
    grunnlag: mengdeobjekt
    mengdetype:
      - {ifc: ifcklasse, tabell: mengdetype_ifcklasse.yaml, navn: IFC-klasse}
      - {ifc: komponentkode, tabell: mengdetype_ns3457.yaml, navn: komponentkode}
    sted: {ifc: materialtilknytning, navn: IfcRelAssociatesMaterial}
    # Not a material (docs/begreper.md §4): a colour or finish, an element word, a bare number or
    # dimension, a tool's placeholder. Carried but not usable: outside the accepted values.
    ikke_materiale:
      - '\bRAL\b'
      - '\bNCS\b'
      - 'lakkert'
      - '^hvit$'
      - '^(dekke|innervegg|yttervegg|vegg|gulv|tak)$'
      - '^[\d\s.,x×]+$'
      - '^default(\(\d+\))?$'
      - '^MC_\d+_\d+_\d+'
      - '^<.*>$'

  - id: kopiobjekt
    seksjon: standardkrav
    tittel: Kopiobjekt
    krav_tekst: feltet finnes, verdien er eierens fagkode
    # No home in the IFC standard: «ikke konfigurert» until a project declares where it lives.
    dekning: finnes

  - id: mmi
    seksjon: standardkrav
    tittel: MMI
    krav_tekst: feltet finnes, verdien er en prosjektkode
    # No home in the IFC standard (MMI-veilederen 2.0 §3.3 leaves the property set to the project):
    # «ikke konfigurert» until a project declares it.
    dekning: finnes

  - id: fase
    seksjon: standardkrav
    tittel: Fase
    krav_tekst: status NEW, EXISTING, DEMOLISH eller TEMPORARY
    # PEnum_ElementStatus. OTHER, NOTKNOWN and UNSET are carried but say nothing: outside. The same
    # property and values in IFC2X3's Common property sets.
    gyldige: [NEW, EXISTING, DEMOLISH, TEMPORARY]
    sted: {pset_monster: '^Pset_\w*Common$', egenskap: Status}
    # MMI phasing (edkjo 2026-09-25): when the project declares `forventet.mmi.fase` (MMI code ->
    # phase), Fase's one location is the MMI requirement's location and the phase is read through
    # that mapping: Dekning = the element has an MMI value, Gyldig = the value maps to a phase, the
    # Fordeling shows the phases. Without it, the location above. Exactly one location either way;
    # a value that is not where it should be is reported, never looked for elsewhere.
    krav_tekst_mmi_fase: fase fra MMI-kode
