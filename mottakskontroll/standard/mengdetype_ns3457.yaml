# mengdetype_ns3457.yaml
#
# Oppslagstabell: telleobjekt eller mengdeobjekt per komponentkode i NS 3457-8:2021.
#
# Hver rad er en ANBEFALING. Et prosjekt kan overstyre den (unit_override i typeregisteret).
#
# Generert 2026-09-23 av 02_Arbeid/gen_mengdetype_ns3457.py (Claude-agent for edkjo). Radene er satt for
# hånd i skriptet, ikke utledet; kjøres det på nytt, gjenskapes filen, ikke vurderingene. Kilder:
#   - C:/workspace/resources/standards/ns3457/ns3457_8_codes.py (kodelisten, 789 koder, navn ordrett)
#   - HI90_Mottakskontroll/docs/begreper.md §6 (definisjonene av telleobjekt og mengdeobjekt)
#   - HI90_Reduzer-klargjøring/.../src/build_type_register.py (COUNT_/LINEAR_/PLANAR_/VOLUME_CLASSES,
#     classify_unit: den deterministiske regelen per IFC-klasse; tabellen følger den der klassen er opplagt)
#   - HI90_Reduzer-klargjøring/.../docs/HI90-scope-config.md §3 (typetaksonomi = materialmodell)
#   - ~/.claude/skills/qto-model-analysis/knowledge/method.md (ledeenhet per komponentklasse)
#
# Felt:
#   mengdetype   telleobjekt   telles; ledeenhet stk; produktet er materialmodellen, én EPD per stk
#                mengdeobjekt  måles; ledeenhet m, m2 eller m3; materiallag per ledeenhet
#                avhenger      koden dekker begge kinds; begrunnelse sier hva det avhenger av. Et reelt svar,
#                              aldri en tom celle: prosjektet må velge side per type
#                ikke_relevant koden er ikke en komponent som kan telles eller måles (samme verdi som
#                              søstertabellen per IFC-klasse bruker for det samme)
#   ledeenhet    stk | m | m2 | m3 | kg | null. null der enheten varierer innenfor koden, og alltid ved
#                avhenger og ikke_relevant
#   begrunnelse  hva tingen er, og IFC-klassen regelen bygger på
#   ikke_komponent  true, bare på rader med mengdetype ikke_relevant. Skiller «ikke en komponent» fra
#                «genuint begge deler» (avhenger), slik rapporten skiller mangler fra avvik. Feltet
#                finnes ikke på andre rader.
#
# Merk:
#   - Nivå 1-koder (A, B, C ...) er kategorier, ikke komponenter: ikke_relevant, svaret ligger i underkoden.
#   - Koder merket «Bør ikke benyttes» (P, T, W, Å, Æ, Ø), virtuelle komponenter (Y*), programvare (OQ),
#     systembærer (OF), målepunkt (RX*), kjemikalier (CM) og åpninger (AU*) er ikke_relevant med
#     begrunnelse som sier hvorfor.
#   - Dører og vinduer står som stk etter typeregisteret. Solibri-rutekartet (qto/v1/metode.md) sier m².
#     Punktet er åpent, se begreper.md §6.
#   - Stål i volumklasser (bjelke, søyle, fagverk, plate) regnes til kg via volum × tetthet. Ledeenheten
#     her er klassens (m3 / m2); kg er avledet.
#

