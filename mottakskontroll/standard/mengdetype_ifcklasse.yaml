# mengdetype_ifcklasse.yaml
#
# Oppslagstabell: er et objekt av denne IFC-klassen et TELLEOBJEKT (telles, ledeenhet stk,
# én produkt-EPD per stykk) eller et MENGDEOBJEKT (måles, ledeenhet m, m2 eller m3,
# materiallag per ledeenhet)? Se docs/begreper.md §6.
#
# Hver rad er en ANBEFALING. Et prosjekt kan overstyre den per type med `unit_override`.
#
# Generert 2026-09-23. Klasselisten er lest programmatisk fra ifcopenshell 0.8.5
# (`ifcopenshell_wrapper.schema_by_name("IFC4")` og `("IFC2X3")`): alle konkrete
# subtyper av IfcProduct, abstrakte supertyper utelatt. `schema` sier hvilke skjema
# klassen finnes i. Ingen av de sju klassene som bare finnes i IFC2X3
# (IfcElectricalElement, IfcEquipmentElement, IfcElectricDistributionPoint,
# IfcChamferEdgeFeature, IfcRoundedEdgeFeature, IfcStructuralLinearActionVarying,
# IfcStructuralPlanarActionVarying) forekommer i HI90-modellene, så de er ikke tatt med.
# Tildelingene er satt for hånd i denne økta, ikke regnet ut.
#
# Verdier:
#   mengdetype   telleobjekt | mengdeobjekt | avhenger | ikke_relevant
#   ledeenhet    stk | m | m2 | m3 | kg | null
#   kilde        eksisterende_regel  svaret står i en av regeltabellene under
#                utledet             svaret er utledet her, uten presedens
#   avhenger     klassen spenner reelt over begge; begrunnelsen sier hva det avhenger av
#   ikke_relevant klassen bærer ingen mengde i denne forstand (romlig, påskrift, akse, virtuell,
#                analysemodell) eller mengden bæres av et annet objekt (hull, delelement)
#
# Kilder, i prioritert rekkefølge der de er uenige:
#   1. HI90_Reduzer-klargjøring/02_Arbeid/qto-lca/02_Arbeid/src/build_type_register.py
#      COUNT_CLASSES, LINEAR_CLASSES, PLANAR_CLASSES, VOLUME_CLASSES, SKIP_ENTITIES, classify_unit()
#   2. HI90_Reduzer-klargjøring/02_Arbeid/typeregister.py
#      ENHETSREGLER (is_a, så subtyper arver), EKSKLUDERTE_KLASSER
#   3. HI90_Reduzer-klargjøring/02_Arbeid/qto/v1/metode.md §2 HOVEDENHET (Solibri-rutekartet)
#   4. HI90_Mottakskontroll/docs/begreper.md §6
#   5. ~/.claude/skills/qto-model-analysis/knowledge/method.md, «Lead unit per component class»
#
# Der tabellene er uenige er svaret fra kilde 1 båret inn, og uenigheten står i begrunnelsen.
# Kjent uavklart punkt: IfcDoor og IfcWindow (stk i 1 og 2, m2 i 3). Uenigheten er ikke avgjort her.
#

