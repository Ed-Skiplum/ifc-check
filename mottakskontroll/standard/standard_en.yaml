# English labels for the standard layer: the parallel table to the Norwegian words in
# standard.yaml, read when a project sets `spraak: en` (konfig.py). Every engine-owned word the
# report, workbook and avvik workbooks print. Rules, locations and values stay in standard.yaml.
#
# konfig.py refuses a run in English when a key of standard.yaml `etiketter` or `verdiktord` has no
# entry here, so a new Norwegian label cannot reach an English report unnoticed. A project still
# overrides any key in its own krav.yaml `etiketter` / `verdiktord`, on top of this table.
#
# Project-authored text (block `tittel` and `krav_tekst` in krav.yaml, the requirements' `tittel` and
# `maaler`, section titles a project declares, merknader) is printed as the project writes it.
# Terms of art stay as in the BEP: MMI, NS 3451, NS 3457-8, IFC class and property set names.

